[project]
name = "tuerca-y-perno-rc"
version = "0.1.0"
description = "Backend para sistema de gestión de Ferretería y Corralón Tuerca y Perno RC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "drf-spectacular>=0.27.0",
    "django-filter>=24.2",
    "django-cors-headers>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tuerca_perno_rc", "negocio", "usuarios"]
